<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="imagenes/logo_pestaña.png" />
    <link rel="stylesheet" href="estilos.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "archi-dark": "#0D0221",
              "archi-blue": "#26408B",
              "archi-cyan": "#A6CFD5",
              "archi-light-cyan": "#C2E7D9",
              "archi-beige": "#FFF8F0",
            },
          },
        },
      };
    </script>
    <title>Inicio de sesión</title>
<body class="font-sans bg-archi-beige text-gray-800">
  <header
        class="border-2 border-archi-blue rounded-[50px] px-8 py-3 bg-denim-white/80 backdrop-blur-md mb-5 sticky top-5 z-50 mx-[20px]">
        <div class="flex justify-between items-center">

            <div class="flex items-center gap-2">
                <img src="imagenes/azul1.png" alt="Logo 1" class="h-7 w-auto object-contain">
                <img src="imagenes/azul2.png" alt="Logo 2" class="h-7 w-auto object-contain">
            </div>

            <nav class="hidden md:flex gap-6 text-archi-blue font-semibold">
                <a href="index.html"
                    class="px-3 py-1 hover:bg-archi-blue hover:text-archi-beige rounded transition-all">Inicio</a>
                <a href="inicio_sesion.html"
                    class="px-3 py-1 hover:bg-archi-blue hover:text-archi-beige rounded transition-all">Iniciar
                    Sesión</a>
                <a href="contactenos.html"
                    class="px-3 py-1 hover:bg-archi-blue  hover:text-archi-beige rounded transition-all">Contáctenos</a>
                <a href="productos.html"
                    class="px-3 py-1 hover:bg-archi-blue  hover:text-archi-beige rounded transition-all">Productos</a>
            </nav>

            <div class="flex items-center gap-5">
                <div
                    class="flex items-center border border-archi-blue rounded-full px-4 py-1 bg-denim-white/50 backdrop-blur-md">
                    <span class="text-xs">🔍</span>
                    <input type="text" placeholder="Buscar"
                        class="bg-transparent border-none outline-none ml-2 text-sm text-archi-blue w-24 lg:w-40">
                </div>

                <div class="flex gap-3">
                    <img src="imagenes/usuario.png" alt="User" class="h-6 w-6 cursor-pointer">
                    <img src="imagenes/carro-de-la-compra.png" alt="Cart" class="h-6 w-6 cursor-pointer">
                </div>
            </div>

        </div>
    </header>

    <!-- MAIN - Contenido principal -->
    <main class="py-10">
      <div class="max-w-[1200px] mx-auto px-5">
        <!-- SECCIÓN DE LOGIN -->
        <section id="formulario" class="max-w-[500px] mx-auto">
          <div
            class="bg-white p-10 my-5 mx-auto border-2 border-gray-300 rounded-2xl md:p-10 md:my-5"
          >
            <div class="text-center mb-8 pb-4 border-b-[3px] border-archi-cyan">
              <h2 id="login-title" class="text-archi-blue text-3xl mb-2">
                Accede a tu cuenta
              </h2>
              <p class="text-gray-600 text-base">
                Ingresa tus credenciales para continuar
              </p>
            </div>

            <form action="#" method="post" autocomplete="on">
              <!-- Campo Usuario -->
              <div class="mb-5">
                <label
                  for="username"
                  class="block text-archi-blue font-bold mb-2"
                  >Usuario:</label
                >
                <input
                  placeholder="ingrese su correo"
                  type="email"
                  id="username"
                  name="username"
                  required
                  aria-required="true"
                  class="w-full p-3 border-2 border-archi-cyan rounded-lg text-base focus:border-archi-light-cyan focus:outline-none"
                />
              </div>

              <!-- Campo Contraseña -->
              <div class="mb-5">
                <label
                  for="password"
                  class="block text-archi-blue font-bold mb-2"
                  >Contraseña:</label
                >
                <div>
                  <input
                    placeholder="ingrese su contraseña"
                    type="password"
                    id="password"
                    name="password"
                    required
                    aria-required="true"
                    class="w-full p-3 border-2 border-archi-cyan rounded-lg text-base focus:border-archi-light-cyan focus:outline-none"
                  />
                </div>
              </div>

              <!-- Enlaces de recuperación y registro -->
              <div class="text-right my-4">
                <a
                  href="recuperacion.html"
                  class="text-[#0F084B] no-underline hover:underline"
                  >¿Olvidaste tu contraseña?</a
                >
              </div>

              <div class="text-center my-5">
                <p>
                  ¿No tienes una cuenta?
                  <a
                    href="registro.html"
                    class="text-archi-blue no-underline font-bold"
                    >Regístrate Aquí</a
                  >
                </p>
              </div>

              <!-- PREFERENCIAS -->
              <div
                id="preferencias"
                class="bg-gray-50 p-6 my-6 border-2 border-archi-cyan border-l-[5px] border-l-archi-blue rounded-xl"
              >
                <h3
                  class="text-archi-blue text-lg mb-4 pb-2.5 border-b-2 border-gray-300"
                >
                  Preferencias de usuario:
                </h3>

                <div class="flex items-center gap-2.5 mb-3">
                  <input
                    type="checkbox"
                    id="recordar"
                    name="recordar"
                    class="w-[18px] h-[18px]"
                  />
                  <label for="recordar">Recordar mi sesión</label>
                </div>

                <div class="flex items-center gap-2.5 mb-3">
                  <input
                    type="checkbox"
                    id="notificaciones"
                    name="notificaciones"
                    class="w-[18px] h-[18px]"
                  />
                  <label for="notificaciones">Recibir notificaciones</label>
                </div>

                <div class="flex items-center gap-2.5 mb-3">
                  <input
                    type="checkbox"
                    id="terminos"
                    name="terminos"
                    required
                    class="w-[18px] h-[18px]"
                  />
                  <label for="terminos"
                    >Quiero ver la guía de tallas antes de comprar</label
                  >
                </div>
              </div>

              <!-- Botones -->
              <div class="flex flex-col md:flex-row gap-4 mt-6">
                <button
                  type="submit"
                  class="flex-1 p-3 border-none rounded-lg text-base font-bold cursor-pointer bg-archi-cyan text-archi-dark hover:bg-archi-light-cyan transition-colors"
                >
                  Iniciar sesión
                </button>
                <button
                  type="reset"
                  class="flex-1 p-3 border-none rounded-lg text-base font-bold cursor-pointer bg-archi-dark text-archi-cyan hover:bg-archi-light-cyan hover:text-archi-dark transition-colors"
                >
                  Limpiar formulario
                </button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-20 border-t-4 border-archi-blue bg-archi-blue/5 rounded-t-[50px] p-10 lg:p-20 text-archi-blue mx-[10px]">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 max-w-[1200px] mx-auto">

            <div>
                <h3 class="text-2xl font-bold mb-6 text-archi-blue">¿NECESITAS AYUDA?</h3>
                <div class="space-y-4">
                    <p class="flex items-center gap-3">              
                      <svg class="w-5 h-5 text-archi-blue" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
                      </svg>
                      +57 3197561958
                    </p>
                    <p class="flex items-center gap-3">
                      <svg class="w-5 h-5 text-archi-blue" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
                      </svg>
                      +57 3122358703
                    </p>
                </div>
            </div>

            <div>
                <h3 class="text-2xl font-bold mb-6 text-archi-blue">SOCIAL MEDIA</h3>
                <div class="flex gap-4">
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/gmail.png" alt="Gmail" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/whatsapp.png" alt="WhatsApp" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/facebook.png" alt="Facebook" class="w-6 h-6">
                    </a>
                     <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/youtube.png" alt="Facebook" class="w-6 h-6">
                    </a>
                </div>
            </div>

            <div class="flex flex-col items-center md:items-start">
                <div class="flex items-center gap-4 mb-4">
                    <img src="imagenes/azul1.png" alt="Logo 1"
                        class="h-12 w-auto object-contain transition-transform hover:scale-110">
                    <img src="imagenes/azul2.png" alt="Logo 2"
                        class="h-12 w-auto object-contain transition-transform hover:scale-110">
                </div>

                <p class="text-archi-blue max-w-sm italic opacity-80">
                    Just remember, only denim.
                </p>
            </div>

        </div>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logos/logopestaña.png">
    <link rel="stylesheet" href="styleregistro.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Registrado</title>
</head>
<body class="bg-[var(--color-fondo)] leading-[1.3] font-[fuente1] min-h-screen flex flex-col">
    <header
        class="border-2 border-[var(--color-text)] rounded-[50px] px-8 py-3 backdrop-blur-md mb-5 sticky top-5 z-50 mx-[20px]">
        <div class="flex justify-between items-center">

            <div class="flex items-center gap-2">
                <img src="imagenes/azul1.png" alt="Logo 1" class="h-7 w-auto object-contain">
                <img src="imagenes/azul2.png" alt="Logo 2" class="h-7 w-auto object-contain">
            </div>

            <nav class="hidden md:flex gap-6 text-archi-blue font-semibold">
                <a href="index.html"
                    class=" text-[var(--color-text)] px-3 py-1 hover:bg-[var(--color-text)] hover:text-[var(--color-fondo)] rounded transition-all">Inicio</a>
                <a href="inicio_sesion.html"
                    class=" text-[var(--color-text)] px-3 py-1 hover:bg-[var(--color-text)] hover:text-[var(--color-fondo)] rounded transition-all">Iniciar
                    Sesión</a>
                <a href="contactenos.html"
                    class=" text-[var(--color-text)] px-3 py-1 hover:bg-[var(--color-text)] hover:text-[var(--color-fondo)] rounded transition-all">Contáctenos</a>
                <a href="productos.html"
                    class=" text-[var(--color-text)] px-3 py-1 hover:bg-[var(--color-text)] hover:text-[var(--color-fondo)] rounded transition-all">Productos</a>
            </nav>

            <div class="flex items-center gap-5">
                <div
                    class="flex items-center border border-[var(--color-text)] rounded-full px-4 py-1 bg-denim-white/50 backdrop-blur-md">
                    <span class="text-xs">🔍</span>
                    <input type="text" placeholder="Buscar"
                        class="bg-transparent border-none outline-none ml-2 text-sm text-archi-blue w-24 lg:w-40">
                </div>

                <div class="flex gap-3">
                    <img src="imagenes/usuario.png" alt="User" class="h-6 w-6 cursor-pointer">
                    <img src="imagenes/carro-de-la-compra.png" alt="Cart" class="h-6 w-6 cursor-pointer">
                </div>
            </div>

        </div>
    </header>
    <hr>
    <main class="main-exitoso flex-grow flex items-center justify-center">
        <p
            class="text-[200px] pregistro-exitoso p-[20px] m-[20px] text-center max-w-2xl text-lg text-[var(--color-text)] ">
            Te has registrado correctamente ahora inicia sesión con el correo y contraseña ingresados
        </p>
    </main>
    <hr>
    <footer
        class="mt-auto border-t-4 border-[var(--color-text)] bg-[var(--color-fondo2)] rounded-t-[50px] p-10 lg:p-20 text-[var(--color-text)] mx-[10px]">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 max-w-[1200px] mx-auto">

            <div>
                <h3 class="text-2xl font-bold mb-6 text-[var(--color-text)]">¿NECESITAS AYUDA?</h3>
                <div class="space-y-4">
                    <p class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-[var(--color-text)]" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
                        </svg>
                        +57 3197561958
                    </p>
                    <p class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-[var(--color-text)]" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
                        </svg>
                        +57 3122358703
                    </p>
                </div>
            </div>

            <div>
                <h3 class="text-2xl font-bold mb-6 text-[var(--color-text)]">SOCIAL MEDIA</h3>
                <div class="flex gap-4">
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/gmail.png" alt="Gmail" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/whatsapp.png" alt="WhatsApp" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/facebook.png" alt="Facebook" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="imagenes/youtube.png" alt="Facebook" class="w-6 h-6">
                    </a>
                </div>
            </div>

            <div class="flex flex-col items-center md:items-start">
                <div class="flex items-center gap-4 mb-4">
                    <img src="imagenes/azul1.png" alt="Logo 1"
                        class="h-12 w-auto object-contain transition-transform hover:scale-110">
                    <img src="imagenes/azul2.png" alt="Logo 2"
                        class="h-12 w-auto object-contain transition-transform hover:scale-110">
                </div>

                <p class="text-[var(--color-text)] max-w-sm italic opacity-80">
                    Just remember, only denim.
                </p>
            </div>

        </div>
    </footer>
</body>

</html>

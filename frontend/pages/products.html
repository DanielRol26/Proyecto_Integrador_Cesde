<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="../styles/register.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "archi-dark": "#0A1F5C",
              "archi-blue": "#26408B",
              "archi-cyan": "#A6CFD5",
              "archi-light-cyan": "#C2E7D9",
              "archi-beige": "#ffffff",
            },
          },
        },
      };
    </script>
    <title>Productos - Archipiélago</title>
  </head>

  <body class="bg-archi-beige text-gray-800 font-[fuente1]">
    <header
      class="border-2 border-archi-blue rounded-[50px] px-4 sm:px-6 md:px-8 py-3 bg-denim-white/80 backdrop-blur-md mb-5 sticky top-5 z-50 mx-[10px] sm:mx-[15px] md:mx-[20px]"
    >
      <div class="flex justify-between items-center gap-2 sm:gap-4">
        <div class="flex items-center gap-2 flex-shrink-0">
          <img
            src="../assets/images/logos/remainders-logo.svg"
            alt="Logo 1"
            class="h-5 sm:h-6 md:h-7 w-auto object-contain"
          />
        </div>
        <nav
          class="hidden lg:flex gap-4 xl:gap-6 text-archi-blue font-semibold flex-shrink-0"
        >
          <a
            href="/index.html"
            class="px-3 py-1 hover:bg-archi-blue hover:text-archi-beige rounded transition-all whitespace-nowrap"
            >Inicio</a
          >
          <a
            href="/pages/login.html"
            class="px-3 py-1 hover:bg-archi-blue hover:text-archi-beige rounded transition-all whitespace-nowrap"
            >Iniciar Sesión</a
          >
          <a
            href="/pages/contact.html"
            class="px-3 py-1 hover:bg-archi-blue hover:text-archi-beige rounded transition-all whitespace-nowrap"
            >Contáctenos</a
          >
          <a
            href="/pages/products.html"
            class="px-3 py-1 hover:bg-archi-blue hover:text-archi-beige rounded transition-all whitespace-nowrap"
            >Productos</a
          >
        </nav>

        <div class="flex items-center gap-2 sm:gap-3 md:gap-5 flex-shrink-0">
          <div
            class="hidden md:flex items-center border border-archi-blue rounded-full px-3 md:px-4 py-1 bg-denim-white/50 backdrop-blur-md"
          >
            <span class="text-xs">🔍</span>
            <input
              type="text"
              placeholder="Buscar"
              class="bg-transparent border-none outline-none ml-2 text-sm text-archi-blue w-16 lg:w-24 xl:w-40"
            />
          </div>
          <div class="flex gap-2 sm:gap-3">
            <img
              src="../assets/images/icons/ui/avatar-default-black.png"
              alt="User"
              class="h-5 sm:h-6 w-5 sm:w-6 cursor-pointer flex-shrink-0"
            />
            <img
              src="../assets/images/icons/ui/shopping-cart-black.png"
              alt="Cart"
              class="h-5 sm:h-6 w-5 sm:w-6 cursor-pointer flex-shrink-0"
            />
          </div>
          <button
            id="menu-toggle"
            class="lg:hidden flex flex-col gap-1 p-1 flex-shrink-0"
            type="button"
            aria-label="Abrir o cerrar menu"
          >
            <span class="block w-6 h-0.5 bg-archi-blue"></span>
            <span class="block w-6 h-0.5 bg-archi-blue"></span>
            <span class="block w-6 h-0.5 bg-archi-blue"></span>
          </button>
        </div>
      </div>
      <nav
        id="mobileMenu"
        class="hidden lg:hidden mt-4 flex flex-col gap-2 text-archi-blue font-semibold"
      >
        <a
          href="../index.html"
          class="px-3 py-2 hover:bg-archi-blue hover:text-archi-beige rounded transition-all"
          >Inicio</a
        >
        <a
          href="../pages/login.html"
          class="px-3 py-2 hover:bg-archi-blue hover:text-archi-beige rounded transition-all"
          >Iniciar Sesión</a
        >
        <a
          href="../pages/contact.html"
          class="px-3 py-2 hover:bg-archi-blue hover:text-archi-beige rounded transition-all"
          >Contáctenos</a
        >
        <a
          href="../pages/products.html"
          class="px-3 py-2 hover:bg-archi-blue hover:text-archi-beige rounded transition-all"
          >Productos</a
        >
      </nav>
    </header>

    <main class="py-10">
      <div class="max-w-[1200px] mx-auto px-5">
        <section class="text-center mb-10 py-8">
          <h1 class="text-archi-blue text-4xl mb-2.5">Nuestros Productos</h1>
          <p class="text-gray-600 text-lg">
            Descubre nuestra colección de ropa exclusiva
          </p>
        </section>
        <section class="mb-4">
          <div
            class="flex flex-col md:flex-row gap-4 items-center justify-between py-4 flex-wrap"
          >
            <div
              class="flex items-center border-2 border-archi-cyan rounded-lg px-4 py-2 bg-white w-full md:w-auto md:flex-1 max-w-md"
            >
              <span class="text-gray-400 mr-2">&#128269;</span>
              <input
                type="text"
                id="buscador-productos"
                placeholder="Buscar producto..."
                class="bg-transparent border-none outline-none text-sm text-gray-700 w-full"
              />
            </div>
            <div class="flex gap-3 flex-shrink-0 flex-wrap">
              <select
                id="filtro-orden"
                class="border-2 border-archi-cyan rounded-lg px-4 py-2 text-sm text-archi-blue bg-white outline-none cursor-pointer font-semibold"
              >
                <option value="default">Ordenar por</option>
                <option value="menor">Menor precio</option>
                <option value="mayor">Mayor precio</option>
              </select>
              <select
                id="filtro-categoria"
                class="border-2 border-archi-cyan rounded-lg px-4 py-2 text-sm text-archi-blue bg-white outline-none cursor-pointer font-semibold"
              >
                <option value="default">Categoría</option>
              </select>
              <select
                id="filtro-marca"
                class="border-2 border-archi-cyan rounded-lg px-4 py-2 text-sm text-archi-blue bg-white outline-none cursor-pointer font-semibold"
              >
                <option value="default">Marca</option>
              </select>
              <select
                id="filtro-genero"
                class="border-2 border-archi-cyan rounded-lg px-4 py-2 text-sm text-archi-blue bg-white outline-none cursor-pointer font-semibold"
              >
                <option value="default">Género</option>
              </select>
            </div>
          </div>
          <p id="contador-productos" class="text-sm text-gray-400 mb-2"></p>
        </section>

        <section class="mb-12">
          <div
            id="contenedor-productos"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 py-5"
          ></div>
        </section>
      </div>
    </main>
    <footer
      class="mt-20 border-t-4 border-archi-blue bg-archi-blue/5 rounded-t-[50px] p-10 lg:p-20 text-archi-blue mx-[10px]"
    >
      <div
        class="grid grid-cols-1 md:grid-cols-3 gap-12 max-w-[1200px] mx-auto"
      >
        <div>
          <h3 class="text-2xl font-bold mb-6 text-archi-blue">
            ¿NECESITAS AYUDA?
          </h3>
          <div class="space-y-4">
            <p class="flex items-center gap-3">
              <svg
                class="w-5 h-5 text-archi-blue"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"
                />
              </svg>
              +57 3197561958
            </p>
            <p class="flex items-center gap-3">
              <svg
                class="w-5 h-5 text-archi-blue"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"
                />
              </svg>
              +57 3122358703
            </p>
          </div>
        </div>

        <div>
          <h3 class="text-2xl font-bold mb-6 text-archi-blue">SOCIAL MEDIA</h3>
          <div class="flex gap-4">
            <a
              href="#"
              class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm"
            >
              <img
                src="../assets/images/icons/social/gmail.png"
                alt="Gmail"
                class="w-6 h-6"
              />
            </a>
            <a
              href="#"
              class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm"
            >
              <img
                src="../assets/images/icons/social/whatsapp.png"
                alt="WhatsApp"
                class="w-6 h-6"
              />
            </a>
            <a
              href="#"
              class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm"
            >
              <img
                src="../assets/images/icons/social/facebook.png"
                alt="Facebook"
                class="w-6 h-6"
              />
            </a>
            <a
              href="#"
              class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm"
            >
              <img
                src="../assets/images/icons/social/youtube.png"
                alt="Facebook"
                class="w-6 h-6"
              />
            </a>
          </div>
        </div>

        <div class="flex flex-col items-center md:items-start">
          <div class="flex items-center gap-4 mb-4">
            <img
              src="../assets/images/logos/remainders-logo.svg"
              alt="Logo 1"
              class="h-12 w-auto object-contain transition-transform hover:scale-110"
            />
          </div>

          <p class="text-archi-blue max-w-sm italic opacity-80">
            Just remember, only denim.
          </p>
        </div>
      </div>
    </footer>
    <script type="module" src="../scripts/modules/products.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The RICHN'T - Denim Store</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'archi-cyan': '#a6cfd5',
                        'archi-blue': '#26408b',
                        'denim-white': '#fff8f0',
                    }
                }
            }
        }
    </script>
</head>

<body>

    <header
        class="border-2 border-archi-blue rounded-[50px] px-8 py-3 bg-denim-white/80 backdrop-blur-md mb-5 sticky top-5 z-50">
        <div class="flex justify-between items-center">

            <div class="flex items-center gap-2">
                <img src="logos/azul1.png" alt="Logo 1" class="h-7 w-auto object-contain">
                <img src="logos/azul2.png" alt="Logo 2" class="h-7 w-auto object-contain">
            </div>

            <nav class="hidden md:flex gap-6 text-archi-blue font-semibold">
                <a href="index.html"
                    class="px-3 py-1 hover:bg-archi-blue hover:text-denim-white rounded transition-all">Inicio</a>
                <a href="inicio_sesion.html"
                    class="px-3 py-1 hover:bg-archi-blue hover:text-denim-white rounded transition-all">Iniciar
                    Sesión</a>
                <a href="contactenos.html"
                    class="px-3 py-1 hover:bg-archi-blue hover:text-denim-white rounded transition-all">Contáctenos</a>
            </nav>

            <div class="flex items-center gap-5">
                <div
                    class="flex items-center border border-archi-blue rounded-full px-4 py-1 bg-denim-white/50 backdrop-blur-md">
                    <span class="text-xs">🔍</span>
                    <input type="text" placeholder="Buscar"
                        class="bg-transparent border-none outline-none ml-2 text-sm text-archi-blue w-24 lg:w-40">
                </div>

                <div class="flex gap-3">
                    <img src="banners/usuario.png" alt="User" class="h-6 w-6 cursor-pointer">
                    <img src="banners/carro-de-la-compra.png" alt="Cart" class="h-6 w-6 cursor-pointer">
                </div>
            </div>

        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-[1400px] mx-auto">

        <div class="card card-large relative rounded-[30px] overflow-hidden bg-black h-[400px]">
            <div class="video-background absolute inset-0">
                <video autoplay muted loop class="w-full h-full object-cover">
                    <source src="/videos/video1.mov" type="video/mp4">
                </video>
            </div>

            <div class="image-layer absolute inset-0 transition-transform duration-700">
                <img src="/tarjetas/imagen9.jpg" alt="Denim 1" class="w-full h-full object-cover">
            </div>

            <div class="card-info-fixed">
                <h2 class="text-archi-cyan text-4xl md:text-5xl drop-shadow-lg">
                    INICIA SESIÓN O REGÍSTRATE & RECIBE 10% OFF
                </h2>
            </div>
        </div>

        <div class="card card-tall relative rounded-[30px] overflow-hidden bg-black h-[715px]">
            <div class="video-background absolute inset-0 z-0">
                <video autoplay muted loop class="w-full h-full object-cover">
                    <source src="/videos/video4.mov" type="video/mp4">
                </video>
            </div>

            <div class="image-layer absolute inset-0 transition-transform duration-700">
                <img src="/tarjetas/Image.png" alt="Denim 2" class="w-full h-full object-cover">
            </div>

            <div class="card-info-fix2">
                <h2 class="text-archi-cyan text-5xl drop-shadow-lg">NEW ARRIVALS</h2>
            </div>
        </div>

        <div class="card relative rounded-[30px] overflow-hidden bg-black h-[300px]">
            <div class="video-background absolute inset-0 z-0">
                <video autoplay muted loop class="w-full h-full object-cover">
                    <source src="/videos/video6.mp4" type="video/mp4">
                </video>
            </div>

            <div class="image-layer absolute inset-0 transition-transform duration-700">
                <img src="/tarjetas/imagen7.png" alt="Denim 3" class="w-full h-full object-cover">
            </div>

            <div class="card-info-fix3">
                <h2 class="text-archi-blue text-4xl">RAGE RECORDS</h2>
            </div>
        </div>

        <div class="card relative rounded-[30px] overflow-hidden bg-black h-[300px]">
            <div class="video-background absolute inset-0 z-0">
                <video autoplay muted loop class="w-full h-full object-cover">
                    <source src="/videos/video5.mp4" type="video/mp4">
                </video>
            </div>

            <div class="image-layer absolute inset-0 transition-transform duration-700">
                <img src="/tarjetas/imagen8.jpg" alt="Denim 4" class="w-full h-full object-cover">
            </div>

            <div class="card-info-fix3">
                <h2 class="text-archi-blue text-4xl">DENIM DROPS</h2>
            </div>
        </div>

    </main>

    <footer
        class="mt-24 border-t-4 border-[var(--color-text)] bg-[var(--color-fondo2)] rounded-t-[50px] p-10 lg:p-20 text-[var(--color-text)] mx-[10px]">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 max-w-[1200px] mx-auto">

            <div>
                <h3 class="text-2xl font-bold mb-6 text-[var(--color-text)]">¿NECESITAS AYUDA?</h3>
                <div class="space-y-4">
                    <p class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-[var(--color-text)]" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
                        </svg>
                        +57 3197561958
                    </p>
                    <p class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-[var(--color-text)]" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
                        </svg>
                        +57 3122358703
                    </p>
                </div>
            </div>

            <div>
                <h3 class="text-2xl font-bold mb-6 text-[var(--color-text)]">SOCIAL MEDIA</h3>
                <div class="flex gap-4">
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="banners/gmail.png" alt="Gmail" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="banners/whatsapp.png" alt="WhatsApp" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="banners/facebook.png" alt="Facebook" class="w-6 h-6">
                    </a>
                    <a href="#"
                        class="w-12 h-12 bg-white/50 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
                        <img src="banners/youtube.png" alt="YouTube" class="w-6 h-6">
                    </a>
                </div>
            </div>

            <div class="flex flex-col items-center md:items-start">
                <div class="flex items-center gap-4 mb-4">
                    <img src="imagenes/azul1.png" alt="Logo 1"
                        class="h-12 w-auto object-contain transition-transform hover:scale-110">
                    <img src="imagenes/azul2.png" alt="Logo 2"
                        class="h-12 w-auto object-contain transition-transform hover:scale-110">
                </div>

                <p class="text-[var(--color-text)] max-w-sm italic opacity-80">
                    Just remember, only denim.
                </p>
            </div>

        </div>
    </footer>

</body>

</html>
